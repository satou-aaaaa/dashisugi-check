<style>
/* 投稿前の下書き：生成りの地に、白いカードの投稿。藍の字・朱の印・緑の「直した」 */
:root{
  --bg:#f4efe6; --paper:#fffdf8; --ink:#1f2a44; --ink2:#4f566a; --line:#1f2a4426;
  --ai:#24427a; --ai2:#142a52; --shu:#b8402a; --shu2:#86291a; --ok:#25734a; --ok2:#174f31; --gold:#8a5d0a;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
html{height:100%;font-size:18px}body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;-webkit-tap-highlight-color:transparent;line-height:1.6}
.wrap{max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 88px;display:flex;flex-direction:column;gap:14px;min-height:100vh;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px}
h1{font-weight:900;font-size:1.1rem;margin:0;letter-spacing:.04em;flex:1;min-width:0}
h1 small{display:block;font-size:.75rem;letter-spacing:0;color:var(--ink2);font-weight:500;line-height:1.3}
.icon{all:unset;cursor:pointer;font-size:1.2rem;min-width:48px;height:48px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line);box-sizing:border-box;padding:0 10px;background:var(--paper);font-weight:700}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:58px;border-radius:16px;background:var(--shu);color:#fff;font-weight:900;font-size:1.05rem;padding:8px 18px;text-align:center;box-shadow:0 5px 0 var(--shu2);line-height:1.35;flex-wrap:wrap}
button.main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shu2)}
button.main.alt{background:var(--ai);box-shadow:0 5px 0 var(--ai2)}
button.main.ok{background:var(--ok);box-shadow:0 5px 0 var(--ok2)}
button.main small{font-weight:500;font-size:.8rem}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-weight:700;font-size:.92rem;padding:4px 12px;text-align:center;line-height:1.3}
button.sub:disabled,button.main:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:.85rem;line-height:1.7;margin:0;text-align:center}
.note a,.about a,.src a{color:var(--shu2);display:inline-flex;align-items:center;min-height:44px}
.big{font-weight:900;font-size:1.4rem;text-align:center;margin:0;line-height:1.35}
.title{font-weight:900;font-size:2rem;letter-spacing:.1em;text-align:center;margin:6px 0 0;color:var(--ai2)}
.title span{color:var(--shu)}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:.95rem;line-height:1.7}
.tip{background:var(--paper);border:2px dashed var(--gold);border-radius:14px;padding:.6rem .9rem;font-size:.9rem;line-height:1.7;text-align:left}
.tip b{color:var(--shu2)}
/* 投稿 */
.ask{margin:0;font-weight:700;text-align:center;font-size:.98rem}
.ask b{color:var(--shu2);white-space:nowrap}
.post{background:#fff;border:2px solid var(--line);border-radius:18px;box-shadow:0 6px 16px #1f2a441c;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
.av{width:36px;height:36px;border-radius:50%;background:var(--ai);color:#fff;display:grid;place-items:center;font-weight:900;flex:none}
.ph .who{font-weight:900;font-size:.9rem;flex:1;min-width:6em;line-height:1.3}.ph .who small{display:block;font-weight:500;color:var(--ink2);font-size:.75rem}
.photo{position:relative;aspect-ratio:3/2;background:#ddd;overflow:hidden}
.photo .bg{position:absolute;inset:0;width:100%;height:100%}
.obj{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;display:flex;align-items:center;justify-content:center;border-radius:10px;border:2px solid transparent}
.obj svg{width:100%;height:100%;display:block;pointer-events:none}
.obj:hover{background:#ffffff40}
.cap{padding:8px 10px 12px;display:flex;flex-wrap:wrap;gap:6px;margin:0;align-items:center}
.pt{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;padding:4px 10px;border-radius:10px;border:2px solid #1f2a441a;background:#f6f3ec;font-size:.95rem;line-height:1.4;display:inline-flex;align-items:center;gap:4px}
.pt.meta{font-size:.8rem;background:#eef3fb;border-color:#24427a33}
/* 見つけた（✓と実線）・大丈夫だった（○と点線）・ヒント（破線の輪） */
.hit{border:3px solid var(--shu)!important;background:#fff1ec!important}
.obj.hit{background:#ffffff99!important}
.hit::after{content:"✓ 手がかり";position:absolute;left:2px;top:2px;background:var(--shu);color:#fff;font-size:.62rem;font-weight:900;padding:1px 5px;border-radius:6px;line-height:1.4}
.pt.hit{position:relative;padding-top:16px}
.pt.hit::after{left:4px;top:1px}
.safe{border:2px dashed var(--ai)!important;opacity:.8}
.safe::before{content:"○ 大丈夫";position:absolute;right:2px;bottom:2px;background:var(--ai);color:#fff;font-size:.62rem;font-weight:900;padding:1px 5px;border-radius:6px;line-height:1.4}
.pt.safe{position:relative;padding-bottom:16px}
.pt.safe::before{right:4px;bottom:1px}
.hl{outline:4px dashed var(--gold)!important;outline-offset:-2px;animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{outline-offset:2px}}
/* 直した投稿：写真の手がかりはぼかして「かくした」、文は線で消す */
.fixed .obj.hit svg{filter:blur(6px) grayscale(.6)}
.fixed .obj.hit::after{content:"✓ かくした";white-space:nowrap;background:var(--ok);font-size:.7rem;left:50%;top:50%;transform:translate(-50%,-50%)}
.fixed .pt.hit{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink2);background:#eef7f0!important;border-color:var(--ok)!important}
.fixed .pt.hit::after{content:"✓ 消した";background:var(--ok)}
.msg{min-height:1.6rem;text-align:center;font-weight:700;font-size:.95rem;margin:0}
.msg.bad{color:var(--ai2)}
.found{display:flex;flex-direction:column;gap:8px}
.fc{background:var(--paper);border:2px solid var(--shu);border-left-width:8px;border-radius:12px;padding:8px 12px;font-size:.9rem;line-height:1.6;animation:up .3s ease-out}
.fc b{display:block;font-size:.95rem}
.fc .cat{display:inline-block;background:var(--shu2);color:#fff;font-size:.72rem;border-radius:6px;padding:0 6px;margin-right:6px;font-weight:700}
.fc .fx{color:var(--ok2);font-weight:700}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.verdict{background:var(--paper);border:2px solid var(--ok);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #1f2a4420;animation:up .35s ease-out}
.verdict .hd{display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:1.25rem;font-weight:900;flex-wrap:wrap}
.verdict ul{margin:0;padding-left:1.2em;font-size:.92rem;line-height:1.7}
.hint{background:var(--paper);border:2px solid var(--gold);border-radius:14px;padding:.6rem .9rem;font-size:.92rem;line-height:1.7}
.stars{color:var(--gold);letter-spacing:.08em;font-size:1.15rem}
.stars .off{color:#1f2a4455}
.dots{display:flex;gap:6px;flex:1;max-width:200px}
.dots i{flex:1;height:8px;border-radius:4px;background:#fff;border:1.5px solid var(--ink2);box-sizing:border-box}
.dots i.on{background:var(--shu);border-color:var(--shu);height:12px}.dots i.done{background:var(--ai);border-color:var(--ai)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:1.25rem}
.stats small{color:var(--ink2);font-size:.75rem}
.share{background:var(--paper);border-radius:12px;padding:12px;white-space:pre-line;font-size:1rem;line-height:1.6;text-align:center;border:2px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font-size:.88rem;font-weight:700;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.rlist{display:flex;flex-direction:column;gap:8px}
.rlist div{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.88rem;line-height:1.5}
.rlist .w{flex:1;min-width:0}
.rlist .w b{display:block;font-size:.92rem}
.achnext{text-align:center;font-size:.9rem;color:var(--ink2);margin:0}
.achnew{text-align:center;font-size:.95rem;font-weight:700;color:var(--shu2);margin:0;animation:up .35s ease-out}
.badge{background:var(--shu);color:#fff;border-radius:9px;padding:1px 7px;font-size:.75rem}
.lv{display:flex;flex-direction:column;gap:10px}
/* 手がかり帳 */
.agrp{font-size:.85rem;color:var(--ink2);margin:4px 0 -6px;font-weight:700;letter-spacing:.1em}
.book{display:flex;flex-direction:column;gap:8px}
.bk{background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.88rem;line-height:1.6}
.bk b{display:block;font-size:.95rem}
.bk .ct{float:right;font-size:.78rem;color:var(--ink2)}
.bk.no{border-style:dashed;color:var(--ink2)}
.bk .fx{color:var(--ok2);font-weight:700}
.alist{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:1.8rem 1fr auto;grid-template-areas:"ic nm pg" "ic cd cd" "ic br br";align-items:center;gap:3px 10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.ach .ic{grid-area:ic;font-size:1.2rem;text-align:center}
.ach b{grid-area:nm;font-size:.95rem}.ach small{grid-area:cd;color:var(--ink2);font-size:.8rem;line-height:1.4}
.ach .pg{grid-area:pg;font-size:.8rem;color:var(--ink2);white-space:nowrap}
.ach .bar{grid-area:br;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.ach .bar i{display:block;height:100%;background:var(--ai)}
.ach.got{background:#eef3fb;border-color:var(--ai)}
.ach:not(.got) .ic{filter:grayscale(1);opacity:.5}
.calnav{display:flex;align-items:center;gap:8px}.calnav b{flex:1;text-align:center;font-size:1.05rem}.calnav .sub{flex:0 0 64px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:.7rem;color:var(--ink2);text-align:center}
.cal .c{all:unset;box-sizing:border-box;min-height:46px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.88rem;background:var(--paper);border:1px solid var(--line);position:relative;line-height:1.1}
.cal .c i{font-style:normal;font-size:.55rem;letter-spacing:-.05em;color:var(--gold)}
.cal .c.p1{background:#eef3fb}.cal .c.p2{background:#d5e1f3}.cal .c.p3{background:var(--ai);color:#fff;border-color:var(--ai2)}.cal .c.p3 i{color:#ffe9a8}
.cal .c.late{background:transparent;border:1.5px dashed var(--ai);color:var(--ai2)}
.cal .c.miss{cursor:pointer;border:2px dotted var(--shu);color:var(--shu2);background:#fff}
.cal .c.miss i{color:var(--shu2)}
.cal .c.today{border:2px solid var(--ink)}
.cal .c .hd{position:absolute;right:2px;top:1px;font-size:.55rem;color:var(--shu2);font-weight:900}
.cal .c.p3 .hd{color:#ffe9a8}
.cal .c.off{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:.75rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend em{display:inline-block;width:14px;height:14px;border-radius:4px;font-style:normal}
.about h3{font-size:1rem;margin:.6rem 0 .2rem;color:var(--ai2)}
.about p,.about li{font-size:.92rem;line-height:1.8;text-align:left}
.about ul{padding-left:1.2em;margin:0}
dialog#howto{border:none;border-radius:16px;background:var(--paper);color:var(--ink);max-width:440px;width:calc(100% - 32px);padding:20px;box-sizing:border-box;font-size:1rem}
dialog#howto::backdrop{background:#000000aa}
dialog#howto h2{margin:0 0 10px;letter-spacing:.1em}
dialog#howto ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog#howto p{margin:0 0 10px;font-size:.9rem;line-height:1.7;color:var(--ink2)}
dialog#howto a{color:var(--shu2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center;font-size:1rem}
footer{margin-top:auto;text-align:center;font-size:.8rem;color:var(--ink2);display:flex;gap:4px 14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;min-width:44px;justify-content:center;display:inline-flex;align-items:center}
/* 色の見分けを助ける：見つけた＝朱から濃い橙、大丈夫＝青。印の文字を大きく */
html.a11y-cvd .hit{border-color:#b35a00!important}
html.a11y-cvd .hit::after{background:#8a4500;font-size:.75rem}
html.a11y-cvd .safe{border-color:#0060a0!important}
html.a11y-cvd .safe::before{background:#0060a0;font-size:.75rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:is(.icon,button,a):focus-visible{outline:3px solid var(--shu)!important;outline-offset:2px}
</style>

html.a11y-calm *,html.a11y-calm *::before,html.a11y-calm *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}

.a11y-btn.a11y-float{position:fixed;left:max(8px,env(safe-area-inset-left,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));z-index:2147483000}

.a11y-saybtn[hidden],.a11y-dlg [hidden]{display:none!important}
.a11y-note{font-size:13px!important}

<script id="a11y-script">
/* 見やすさの設定（色覚・ディスレクシア・弱視・動きに弱い人のため）。外へは何も送らない。
   設定は localStorage の a11y-v1 に置く。同じサイト（satou-aaaaa.github.io）のゲームは同じ設定を使う。

  const showKofi = first && mode !== "p" && !late && total === 0 && !s.kofi[k + mode]; // あとから・練習・まちがいのある日には出さない
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>出しすぎチェック<small>${mode === "d" ? `今日の5つ 第${dayNo(k)}回` : late ? `第${dayNo(k)}回 あとから` : mode === "h" ? "上級" : "練習"}</small></h1></header>
    <p class="big" data-a11y-say>${total === 0 ? "見のがしゼロ！" : `${list.length}つの投稿をチェックしました`}</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    ${(() => { const nx = nextAch(s); return nx ? `<p class="achnext" id="achnext">🎯 あと${nx.left}${nx.unit}で「${nx.name}」</p>` : ""; })()}
    <div class="rlist">${list.map((tag, j) => { const P = G.make(tag); return `<div><span>${starStr(starsOf(rec.m[j]))}</span><span class="w"><b>${esc(P.sceneName)}</b>${P.leaks.map((u) => esc(G.LEAKS[P.parts.find((p) => p.uid === u).id].cat)).join("・")}</span></div>`; }).join("")}</div>
    ${late ? `<p class="note">あとから遊んだ日は、カレンダーに ↺ で残ります（続けた日には数えません）。</p><button class="main alt" id="go-cal">カレンダーへ</button>` : ""}
    ${mode !== "p" && !late ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🟢まちがいなし　🔶1〜2回　🔺3回以上<br>次の5つまで あと <b>${untilNext()}</b></p>` : ""}
    <button class="main alt" id="go-e">続けて遊ぶ：とことん${s.ebest ? `（ベスト ${s.ebest}こ）` : ""}</button>
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：見落としやすい3つに挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">手がかり帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">役に立ったら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-p").onclick = practiceMenu; $("go-dex").onclick = book;
  $("go-e").onclick = () => startRun("e");
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home());
  if ($("go-cal")) $("go-cal").onclick = () => cal(k.slice(0, 7));
  if (mode !== "p" && !late) {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
  toTop();
}

// 手がかり帳：見つけた手がかりの種類・なぜ・どうする・出典。まだのものは名前を出さない
const BGRP = [["photo", "写真に写るもの"], ["text", "文に書くこと"], ["meta", "投稿の情報"]];
function book() {
  const s = load(), n = tally(s).kinds;
  const sample = { town: "○○町", sur: "○○", given: "○○", shop: "○○屋", g: 1, c: 1, school: "○○中学校", station: "○○駅" };
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>手がかり帳<small>${n}/${G.LEAK_IDS.length}種類</small></h1></header>
    <p class="note" data-a11y-say>見つけた手がかりが集まります。☆は見落としやすいものです。</p>
    ${BGRP.map(([w, l]) => `<p class="agrp">${l}</p><div class="book">${G.LEAK_IDS.filter((id) => G.LEAKS[id].kind === w).map((id) => { const L = G.LEAKS[id], c = s.dex[id] || 0, S = G.SRC[L.src];
      return c ? `<div class="bk" data-id="${id}"><span class="ct">${c}回</span><b>${L.sub ? "☆ " : ""}${esc(L.name(sample))}</b><span class="cat" style="font-size:.78rem;color:var(--shu2);font-weight:700">${esc(L.cat)}</span>　${esc(L.why)}<br><span class="fx">👉 ${esc(L.fix)}</span><br><small class="src">出典：<a href="${S.u}" target="_blank" rel="noopener">${esc(S.t)}</a></small></div>`
        : `<div class="bk no" role="img" aria-label="まだ見つけていない手がかり">？ まだ見つけていない${L.sub ? "（☆ 見落としやすい）" : ""}</div>`; }).join("")}</div>`).join("")}
    ${footer()}`;
  $("back").onclick = home; bindFooter(); toTop();
}
function achView() {
  const s = load(), t = tally(s), got = achGot(s);
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${got.length}/${ACH.length}</small></h1></header>
    ${AGRP.map((g, gi) => `<p class="agrp">${g}</p><div class="alist">${ACH.filter((a) => a[3] === gi).map((a) => { const ok = got.includes(a[0]), n = Math.min(t[a[4]], a[5]); return `<div class="ach${ok ? " got" : ""}" data-id="${a[0]}"><span class="ic" aria-hidden="true">🏅</span><b>${ok ? "✓ " : ""}${a[1]}</b><span class="pg">${ok ? "達成" : `${n}/${a[5]}`}</span><small>${a[2]}</small>${ok ? "" : `<span class="bar"><i style="width:${Math.round((n / a[5]) * 100)}%"></i></span>`}</div>`; }).join("")}</div>`).join("")}
    ${footer()}`;
  $("back").onclick = home; bindFooter(); toTop();
}
// カレンダー：今日の5つの日は★（まちがいの少なさ）、あとから遊んだ日は ↺、取りこぼした過去7日（点線）は押すとあとから遊べる
const ymOf = (k) => k.slice(0, 7);
const ymAdd = (ym, n) => new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)).toISOString().slice(0, 7);
const lvOf = (rec) => { const t = rec.m.reduce((a, b) => a + b, 0); return t === 0 ? 3 : t <= 3 ? 2 : 1; };
function cal(ym) {
  const s = load(), k = todayKey(), late = lateDays(s, k), st = streak(s.days);
  if (!ym || ym > ymOf(k)) ym = ymOf(k);
  if (ym < ymOf(EPOCH)) ym = ymOf(EPOCH);
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), dow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate(), cells = [];
  for (let i = 0; i < dow; i++) cells.push(`<span class="c off"></span>`);
  for (let d = 1; d <= n; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, rec = s.days[key], ar = s.adays[key], hd = s.hdays[key] ? `<span class="hd">上</span>` : "";
    if (rec) { const lv = lvOf(rec); cells.push(`<span class="c p${lv}" data-k="${key}" role="img" aria-label="${m}月${d}日 星${lv}つ${hd ? "・上級も" : ""}">${d}<i>${"★".repeat(lv)}</i>${hd}</span>`); }
    else if (ar) cells.push(`<span class="c late" data-k="${key}" role="img" aria-label="${m}月${d}日 あとから遊んだ">${d}<i>↺</i></span>`);
    else if (late.includes(key)) { const go = s.runs[runKey("a", key)]; cells.push(`<button class="c miss" data-k="${key}" aria-label="${m}月${d}日をあとから遊ぶ${go ? "（続きから）" : ""}">${d}<i>${go ? "続き" : "▶"}</i></button>`); }
    else cells.push(`<span class="c${key === k ? " today" : ""}" data-k="${key}">${d}</span>`);
  }
  const pd = playedDays(s);
  app.innerHTML = `<header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>カレンダー${pd ? `<small>合わせて ${pd}日${st >= 1 ? `・続けて ${st}日` : ""}</small>` : ""}</h1></header>
    <div class="calnav"><button class="sub" id="prev" aria-label="前の月"${ym <= ymOf(EPOCH) ? " disabled" : ""}>‹</button><b>${y}年${m}月</b><button class="sub" id="next" aria-label="次の月"${ym >= ymOf(k) ? " disabled" : ""}>›</button></div>
    <div class="cal">${["日", "月", "火", "水", "木", "金", "土"].map((w) => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span><em style="background:var(--ai)"></em>★★★ まちがいなし</span><span><em style="background:#d5e1f3"></em>★★ 1〜3回</span><span>↺ あとから</span><span>上 上級</span></div>
    ${late.length ? `<p class="note">▶ の日は、その日の5つをあとから遊べます（過去7日まで・続けた日には数えません）。</p>` : ""}
    ${footer()}`;
  $("back").onclick = home; $("prev").onclick = () => cal(ymAdd(ym, -1)); $("next").onclick = () => cal(ymAdd(ym, 1));
  document.querySelectorAll(".cal .miss").forEach((b) => (b.onclick = () => (lateDays(load()).includes(b.dataset.k) ? startRun("a", b.dataset.k) : cal(ym))));
  bindFooter(); toTop();
}
function about() {
  app.innerHTML = `<header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>このゲームについて</h1></header>
    <div class="about" id="about">
      <h3>投稿する前の「見なおし」の練習</h3>
      <p>写真の背景や、何気ない一言を組み合わせると、住んでいる所・学校・行動がわかってしまうことがあります。このゲームでは、作り話の投稿で手がかりを探す練習をします。出てくる人・町・学校・店はすべて作り話です。</p>
      <h3>公的な資料で言われていること</h3>
      <ul>
        <li>写真の背景に映った店・建物・電柱の文字などから、生活している所が推測されることがあります。</li>
        <li>電柱の広告・店の名前・車のナンバー・目立つ建物を組み合わせると、場所がわかることがあります。行事の一言から学校がわかることもあります。</li>
        <li>位置情報はオフにし、その場での投稿（リアルタイムの投稿）は避けるのが安全です。旅行で家を空けることがわかる投稿は、空き巣のきっかけになることがあります。</li>
        <li>顔写真・自宅・学校名・本名・電話番号は、なるべく公開しないようにします。公開する相手をしぼる設定も使えます。</li>
      </ul>
      <h3>困ったときは</h3>
      <p>こわいこと・いやなことがあったら、ひとりでかかえず、家の人や先生など身近な大人に相談してください。ネットの書きこみの相談は「違法・有害情報相談センター」、警察への相談は警察相談専用電話「#9110」でもできます（急ぎのときは110番）。</p>
      <p class="src">出典：${Object.values(G.SRC).map((S) => `<a href="${S.u}" target="_blank" rel="noopener">${esc(S.t)}</a>`).join("・")}・<a href="https://www.ihaho.jp/" target="_blank" rel="noopener">違法・有害情報相談センター</a>・<a href="https://www.gov-online.go.jp/" target="_blank" rel="noopener">政府広報オンライン（#9110）</a></p>
    </div>${footer()}`;
  $("back").onclick = home; bindFooter(); toTop();
}
